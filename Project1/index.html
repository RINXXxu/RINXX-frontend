<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 
      ═══════════════════════════════════════════════════════════
      这里存放了网站标题、favicon、SEO 等知识点
      你可以选择性修改，或直接删除整段并重写你想要的
      ═══════════════════════════════════════════════════════════
    -->
    <title>Rinxxtagram</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>

    <!-- ========================================================== -->
    <!-- 导航栏                                                -->
    <!-- ═════════════════════════════════════════════════════════════════ -->
    
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <span class="logo">Rinxxtagram</span>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="about.html" class="active">关于</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
                <button class="menu-toggle" id="menuToggle" title="菜单栏" aria-label="菜单">☰</button>
            </div>
        </div>
    </nav>

    <!-- ========================================================== -->
    <!-- 博客主要内容                                              -->
    <!-- ═══════════════════════════════════════════════════════════ -->

    <main class="container main-grid">

        <!-- ===== 文章列表 ===== -->
        <section class="articles-section">
            <div class="section-header">
                <h2 id="text">全部文章</h2>
                <div class="search-box">
                    <!-- 必须保留 id="searchInput" -->
                    <input type="text" id="searchInput" placeholder="搜索文章..." />
                </div>
            </div>

            <!-- 分类筛选 — 必须保留 id="categoryFilters" -->
            <div class="category-filters" id="categoryFilters">
                <!-- 由 JS 动态生成，你也可以删掉自己写 -->
            </div>

            <!-- 文章列表 — 必须保留 id="articlesGrid" -->
            <div class="articles-grid" id="articlesGrid">
            </div>
        </section>

        <!-- ===== 侧边栏 ===== -->
        <aside class="sidebar">

            <!-- ========================================================== -->
            <!-- 你可以删掉整个侧边栏重写，或删掉部分卡片              -->
            <!-- ========================================================== -->

            <!-- 个人简介 -->
            <div class="sidebar-card profile-card">
                <img src="photo.png" style="width:150px;height:150px;border-radius:10px">
                <h3>RINXX</h3>
                <p class="profile-bio">（写了一句介绍让你对我有了深入了解）</p>
                <div class="profile-social">
                    <a href="https://github.com/RINXXxu">GitHub</a>
                    <span> | </span>
                    <a href="https://www.zhihu.com/people/dramione-45">知乎</a>
                </div>
            </div>

            <!-- (选做) 统计 — 完成该功能需保留 id="totalArticles" "totalCategories" -->
            <div class="sidebar-card">
                <h4>统计</h4>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-number" id="totalArticles">12</span>
                        <span class="stat-label">文章</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="totalCategories">3</span>
                        <span class="stat-label">分类</span>
                    </div>
                </div>
            </div>

        </aside>

    </main>

    <button id="backToTop" class="back-to-top" aria-label="返回顶部">↑</button>

    <!-- ========================================================== -->
    <!-- 页脚                                                     -->
    <!-- ========================================================== -->
    
    <footer class="footer">
        <div class="container footer-content">
            <p>© 2026 Rinxxtagram | Framework by <a href="https://github.com/hechawai">DaYan</a></p>
            <p class="footer-tech">HTML · CSS · JavaScript</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
